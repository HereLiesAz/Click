pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        maven {
            url 'https://raw.githubusercontent.com/HereLiesAz/AzNavRail/update-maven/'
            content {
                includeModule('com.github.HereLiesAz.AzNavRail', 'aznavrail-updates-compat')
                includeModule('com.github.HereLiesAz.AzNavRail', 'aznavrail-updates-play-compat')
            }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = "Click"
include ':app'
